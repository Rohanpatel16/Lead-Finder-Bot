name: Lead Finder & Email Enricher

concurrency:
  group: lead-finder-engine
  cancel-in-progress: false

on:
  schedule:
    # Runs Monday to Saturday at 08:00 AM IST (02:30 AM UTC)
    - cron: '30 2 * * 1-6'

  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

jobs:
  run-finder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Lead Finder Script
        run: node finder.mjs
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
